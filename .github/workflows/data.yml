# Daily Riskometer update (MASTER_PROMPT §9 "Tägliches Update").
# ECB reference rates are published on TARGET working days around 16:00 CET; the job runs
# Monday to Friday at 15:30 UTC (16:30 CET / 17:30 CEST).
# fetch → validate → compute → check + build → commit only if the data changed.
# A validation failure in `data:fetch` (exit code 1) ends the job before anything is committed.
# Pushes made with the GITHUB_TOKEN do not start other workflows, so check and build run here;
# Cloudflare Workers Builds deploys the pushed commit through its own GitHub integration.
name: Data

on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch and validate ECB reference rates
        run: npm run data:fetch

      - name: Compute Riskometer data
        run: npm run data:build

      - name: Check (types, lint, unit tests) and build
        run: npm run check && npm run build

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data/raw src/data/fx)" ]; then
            echo "No new ECB data, nothing to commit."
            exit 0
          fi
          AS_OF=$(node -p "require('./src/data/fx/summary.json').asOf")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw src/data/fx
          git commit -m "data: ECB ${AS_OF}"
          git push
